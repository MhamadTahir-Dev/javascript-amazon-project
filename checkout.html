<!doctype html>
<html>
  <head>
    <title>Checkout</title>

    <style>
      /* ڕێکخستنی دوگمەی Update و Delete وەک سایتی سەرەکی */
      .link-primary {
        color: rgb(1, 124, 182); /* 👈 ڕەنگە شینەکەی ئەمازۆن */
        cursor: pointer; /* 👈 گۆڕینی ماوسەکە بۆ شێوازی دەست */
      }

      /* کاتێک ماوسەکە دەچێتە سەری، ڕەنگەکەی پرتەقاڵی ببێت */
      .link-primary:hover {
        color: rgb(196, 80, 0); /* 👈 ڕەنگە پرتەقاڵییەکە */
      }
    </style>
    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Here are the CSS files for this page. -->

    <link rel="stylesheet" href="styles/pages/checkout/checkout-header.css" />
    <link rel="stylesheet" href="styles/pages/checkout/checkout.css" />
  </head>

  <!-- In this Lesson: 14
    1. Modules = better way to organize our code
    2. Created the checkout page 
    3. HTML link elements and radio selectors
    4. Made the delete link interactive
    5. Save the cart in localStorage -->

  <!-- In this Lesson: 15
    1. External libraries = code outside of our project
    2. DayJS external library
    3. External libraries + JavaScript Modules, default export
    4. Created the delivery section

    6. Created the payment section  -->

  <body>
